# 反向代理网关：前端静态资源 + 后端 API
#
# 浏览器访问入口：
#   http://localhost/            → 前端 SPA (index.html + assets)
#   http://localhost/api/*       → backend:8082
#   http://localhost/docs        → FastAPI Swagger (backend:8082/docs)
#
# 注意：upstream 名字（backend / frontend）对应 docker-compose.yml 中的服务名。

upstream backend_upstream {
    server backend:8082;
}

server {
    listen 80;
    server_name _;

    # 通用 header
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 前端静态资源（前端容器暴露 80）
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API（FastAPI）
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长响应友好
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # FastAPI Swagger / OpenAPI
    location /docs {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }
}