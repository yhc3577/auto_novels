[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-novels-backend"
version = "0.1.0"
description = "auto_novels backend — FastAPI + LangGraph + async PG demo"
requires-python = ">=3.11"
dependencies = [
  # Web framework
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",

  # Settings / validation
  "pydantic>=2.6",
  "pydantic-settings>=2.2",

  # Async PG stack
  "sqlalchemy[asyncio]>=2.0.27",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",          # Alembic sync DSN (init script)

  # LangGraph + LangChain core (async-friendly)
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "langchain-openai>=0.1",         # optional, for OpenAI provider
  "langchain-anthropic>=0.1",      # optional, for Anthropic provider

  # HTTP client (for any outbound calls)
  "httpx>=0.27",

  # Auth: bcrypt password hashing + JWT
  "bcrypt>=4.0",
  "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "aiosqlite>=0.20",  # in-memory SQLite for auth unit tests
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]